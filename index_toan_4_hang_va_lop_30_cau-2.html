<!doctype html><html lang=vi><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Hàng và lớp - Toán 4</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4faf9;color:#173b39}main{max-width:800px;margin:auto;padding:14px}header{background:#16a89a;color:white;padding:23px;border-radius:22px}h1{margin:0 0 8px}.stats{display:flex;gap:9px;margin:14px 0}.pill{background:white;padding:9px 13px;border-radius:22px;font-weight:bold}.track{height:11px;background:#d8ebe7;border-radius:15px;overflow:hidden}#bar{height:100%;background:#f29a22}.card{background:white;margin-top:14px;padding:21px;border-radius:20px;box-shadow:0 7px 24px #164b4b1c}.tag{font-weight:bold;color:#d37600}h2{line-height:1.45;font-size:clamp(19px,4vw,25px)}#answers{display:grid;gap:10px}.ans{padding:14px;text-align:left;border:2px solid #d7e7e4;background:white;border-radius:13px;font-size:17px}.correct{background:#e7f8eb;border-color:#38a65b}.wrong{background:#fff0ef;border-color:#d85b5b}#feedback{min-height:54px;padding:14px 0;font-weight:bold}#next{display:none;width:100%;padding:14px;border:0;border-radius:13px;background:#079a8e;color:white;font-weight:bold;font-size:17px}</style></head><body><main><header><h1>🔢 Hàng và lớp</h1><div>Toán lớp 4 • Kết nối tri thức<br><b>30 câu • Tỉ lệ 4–3–3</b></div></header><div class=stats><span class=pill id=count></span><span class=pill id=score>⭐ 0 điểm</span></div><div class=track><div id=bar></div></div><section class=card id=card><div class=tag id=tag></div><h2 id=question></h2><div id=answers></div><div id=feedback></div><button id=next>Câu tiếp theo →</button></section></main><script>const Q=[{"level": "NB", "q": "Trong số 514 293, chữ số 1 thuộc hàng nào?", "a": "Hàng chục nghìn", "opts": ["Hàng chục nghìn", "Hàng nghìn", "Hàng triệu", "Hàng trăm nghìn"]}, {"level": "VD", "q": "Ô tô giá 450 000 000 đồng. Chữ số 4 trong số tiền đó có giá trị bao nhiêu?", "a": "400 000 000", "opts": ["4 , {"level": "VD", "q": "Một giỏ có 3 bông hoa, 3 lon nước; hoa 1 000 đồng/bông, nước 10 000 đồng/lon. Giỏ giá bao nhiêu?", "a": "33 000 đồng", "opts": ["13 000 đồng", "30 000 đồng", "33 000 đồng", "31 000 đồng"]}, {"level": "VD", "q": "Điền số: 1 000 000; 2 000 000; 3 000 000; 4 000 000; ...", "a": "5 000 000", "opts": ["10 000 000", "5 000 000", "4 100 000", "6 000 000"]}, {"level": "NB", "q": "Hàng triệu, hàng chục triệu, hàng trăm triệu hợp thành lớp nào?", "a": "Lớp triệu", "opts": ["Lớp tỉ", "Lớp triệu", "Lớp nghìn", "Lớp đơn vị"]}, {"level": "VD", "q": "Máy tính giá 6 000 000 đồng, xe máy giá 17 000 000 đồng. Xe máy đắt hơn bao nhiêu?", "a": "11 000 000 đồng", "opts": ["13 000 000 đồng", "9 000 000 đồng", "11 000 000 đồng", "23 000 000 đồng"]}, {"level": "TH", "q": "Số có 9 ở hàng chục nghìn, 2 ở hàng nghìn, 3 ở hàng trăm, 4 ở hàng chục và 0 ở hàng đơn vị là số nào?", "a": "92 340", "opts": ["902 340", "29 340", "92 340", "923 400"]}, {"level": "TH", "q": "Trong số 362 820, chữ số 2 ở hàng nghìn có giá trị là bao nhiêu?", "a": "2 000", "opts": ["2", "20", "2 000", "200"]}];let i=0,s=0,l=false,$=x=>document.getElementById(x),N={NB:"Nhận biết",TH:"Thông hiểu",VD:"Vận dụng"};function r(){l=false;let x=Q[i];$("count").textContent=`Câu ${i+1}/30`;$("tag").textContent=N[x.level];$("question").textContent=x.q;$("bar").style.width=i/30*100+"%";$("feedback").textContent="";$("next").style.display="none";$("answers").innerHTML="";x.opts.forEach((o,j)=>{let b=document.createElement("button");b.className="ans";b.innerHTML=`<b>${String.fromCharCode(65+j)}.</b> ${o}`;b.onclick=()=>c(o,b);$("answers").appendChild(b)})}function c(o,b){if(l)return;l=true;let x=Q[i];[...$("answers").children].forEach((z,j)=>{z.disabled=true;if(x.opts[j]===x.a)z.classList.add("correct")});if(o===x.a){s++;$("feedback").textContent="✅ Chính xác!"}else{b.classList.add("wrong");$("feedback").textContent="❌ Chưa đúng. Đáp án đúng: "+x.a}$("score").textContent="⭐ "+s+" điểm";$("next").style.display="b
