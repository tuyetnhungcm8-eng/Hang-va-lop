<!doctype html><html lang=vi><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Hàng và lớp - Toán 4</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4faf9;color:#173b39}main{max-width:800px;margin:auto;padding:14px}header{background:#16a89a;color:white;padding:23px;border-radius:22px}h1{margin:0 0 8px}.stats{display:flex;gap:9px;margin:14px 0}.pill{background:white;padding:9px 13px;border-radius:22px;font-weight:bold}.track{height:11px;background:#d8ebe7;border-radius:15px;overflow:hidden}#bar{height:100%;background:#f29a22}.card{background:white;margin-top:14px;padding:21px;border-radius:20px;box-shadow:0 7px 24px #164b4b1c}.tag{font-weight:bold;color:#d37600}h2{line-height:1.45;font-size:clamp(19px,4vw,25px)}#answers{display:grid;gap:10px}.ans{padding:14px;text-align:left;border:2px solid #d7e7e4;background:white;border-radius:13px;font-size:17px}.correct{background:#e7f8eb;border-color:#38a65b}.wrong{background:#fff0ef;border-color:#d85b5b}#feedback{min-height:54px;padding:14px 0;font-weight:bold}#next{display:none;width:100%;padding:14px;border:0;border-radius:13px;background:#079a8e;color:white;font-weight:bold;font-size:17px}</style></head><body><main><header><h1>🔢 Hàng và lớp</h1><div>Toán lớp 4 • Kết nối tri thức<br><b>30 câu • Tỉ lệ 4–3–3</b></div></header><section class="startcard" id="start"><h2>👤 Em hãy chọn đúng họ và tên</h2><select id="student" style="width:100%;padding:14px;border:2px solid #dfe6f1;border-radius:14px;font-size:17px;background:#fff;margin:8px 0 12px"><option value="">-- Chọn học sinh --</option><option value="">-- Chọn học sinh --</option><option value="Đặng Quỳnh Anh">Đặng Quỳnh Anh</option><option value="Lê Ngô Quang Anh">Lê Ngô Quang Anh</option><option value="Võ Hồng Minh Anh">Võ Hồng Minh Anh</option><option value="Nguyễn Lâm Gia Ân">Nguyễn Lâm Gia Ân</option><option value="Trương Hoàng Thiên Ân">Trương Hoàng Thiên Ân</option><option value="Trần Ngu tion><option value="Đoàn Trần Phúc Thịnh">Đoàn Trần Phúc Thịnh</option><option value="Nguyễn Phú Thịnh">Nguyễn Phú Thịnh</option><option value="Đặng Duy Tít">Đặng Duy Tít</option><option value="Nguyễn Phạm Xuân Trà">Nguyễn Phạm Xuân Trà</option><option value="Nguyễn Lê Vy">Nguyễn Lê Vy</option><option value="Nguyễn Ngô Tường Vy">Nguyễn Ngô Tường Vy</option><option value="Nguyễn Trương Hải Yến">Nguyễn Trương Hải Yến</option></select><div id="nameWarn" style="color:#b33;font-weight:700;min-height:24px"></div><button id="startBtn" style="border:0;border-radius:14px;background:#079a8e;color:white;font-size:17px;font-weight:700;padding:15px;width:100%;cursor:pointer">Bắt đầu làm bài</button></section><div id="quiz" style="display:none"><div class=stats><span class=pill id=count></span><span class=pill id=score>⭐ 0 điểm</span></div><div class=track><div id=bar></div></div><section class=card id=card><div class=tag id=tag></div><h2 id=question></h2><div id=answers></div><div id=feedback></div><button id=next>Câu tiếp theo →</button></section></div></main><script>const API='https://script.google.com/macros/s/AKfycbzXHP37p5LKZDVr91U4sOWwFKhnfyD9c0ahjJx3w_d3E5QWcG7cu8XSF8H35xWEFYQs/exec',SHEET='Hàng và lớp 1';let studentName='',startedAt='';const now=()=>new Date().toLocaleString('vi-VN');function sendProgress(status,progress,finishTime=''){if(!studentName)return;fetch(API,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({sheetName:SHEET,name:studentName,status:status,progress:progress,score:s,startTime:startedAt,finishTime:finishTime}),keepalive:true}).catch(()=>{});}const Q=[{"level": "NB", "q": "Trong số 514 293, chữ số 1 thuộc hàng nào?", "a": "Hàng chục nghìn", "opts": ["Hàng chục nghìn", "Hàng nghìn", "Hàng triệu", "Hàng trăm nghìn"]}, {"level": "VD", "q": "Ô tô giá 450 000 000 đồng. Chữ số 4 trong số tiền đó có giá trị bao nhiêu?", "a": "400 000 000", "opts": ["400 000 000", "450 000 000", "4 000 000", "40 000 000"]}, {"level": "VD", "q": "Điền số: 940 000 000; 930 000 000; 920 000 000; 910 000 000; ...", "a": "900 000 000", "opts": ["909 000 000", "901 000 000", "900 000 000", "890 000 000"]}, {"level": "TH", "q": "Chữ số 2 trong số 920 000 000 thuộc hàng nào, lớp nào?", "a": "Hàng chục triệu, lớp triệu", "opts": ["Hàng trăm triệu, lớp triệu", "Hàng triệu, lớp triệu", "Hàng chục triệu, lớp triệu", "Hàng chục nghìn, lớp nghìn"]}, {"level": "TH", "q": "Chữ số 2 trong số 162 000 000 thuộc hàng nào, lớp nào?", "a": "Hàng triệu, lớp triệu", "opts": ["Hàng triệu, lớp triệu", "Hàng trăm nghìn, lớp nghìn", "Hàng chục triệu, lớp triệu", "Hàng trăm triệu, lớp triệu"]}, {"level": "NB", "q": "Trong số 514 293, chữ số 5 thuộc hàng nào?", "a": "Hàng trăm nghìn", "opts": ["Hàng nghìn", "Hàng trăm nghìn", "Hàng triệu", "Hàng chục nghìn"]}, {"level": "NB", "q": "Hàng nghìn, hàng chục nghìn, hàng trăm nghìn hợp thành lớp nào?", "a": "Lớp nghìn", "opts": ["Lớp đơn vị", "Lớp nghìn", "Lớp trăm", "Lớp triệu"]}, {"level": "NB", "q": "Trong số 514 293, chữ số 3 thuộc hàng nào?", "a": "Hàng đơn vị", "opts": ["Hàng trăm", "Hàng đơn vị", "Hàng nghìn", "Hàng chục"]}, {"level": "NB", "q": "Trong số 514 293, chữ số 2 thuộc hàng nào?", "a": "Hàng trăm", "opts": ["Hàng nghìn", "Hàng chục", "Hàng trăm nghìn", "Hàng trăm"]}, {"level": "VD", "q": "Số có chữ số 5 ở hàng chục triệu, 3 ở hàng triệu, 1 ở hàng trăm nghìn; các hàng còn lại đều là 0 là số nào?", "a": "53 100 000", "opts": ["5 310 000", "53 100 000", "53 010 000", "531 000 000"]}, {"level": "NB", "q": "Một trăm triệu được viết là số nào?", "a": "100 000 000", "opts": ["100 000 000", "10 000 000", "100 000", "1 000 000"]}, {"level": "NB", "q": "Số 450 000 000 được đọc là gì?", "a": "Bốn trăm năm mươi triệu", "opts": ["Bốn trăm năm mươi triệu", "Bốn mươi lăm triệu", "Bốn trăm năm mươi nghìn", "Bốn trăm linh năm triệu"]}, {"level": "NB", "q": "Mười triệu được viết là số nào?", "a": "10 000 000", "opts": ["10 000 000", "10 000", "100 000 000", "1 000 000"]}, {"level": "VD", "q": "Số nào gồm các chữ số khác nhau, không chứa chữ số 0 ở lớp đơn vị và chứa chữ số 5 ở lớp nghìn?", "a": "405 239", "opts": ["500 374", "371 905", "405 239", "207 495"]}, {"level": "VD", "q": "Một giỏ có 4 bông hoa và 2 hộp quà; hoa 1 000 đồng/bông, hộp quà 100 000 đồng/hộp. Giỏ giá bao nhiêu?", "a": "204 000 đồng", "opts": ["204 000 đồng", "104 000 đồng", "402 000 đồng", "240 000 đồng"]}, {"level": "TH", "q": "Chữ số 2 trong số 258 000 000 thuộc hàng nào, lớp nào?", "a": "Hàng trăm triệu, lớp triệu", "opts": ["Hàng triệu, lớp triệu", "Hàng trăm nghìn, lớp nghìn", "Hàng trăm triệu, lớp triệu", "Hàng chục triệu, lớp triệu"]}, {"level": "NB", "q": "Hàng đơn vị, hàng chục, hàng trăm hợp thành lớp nào?", "a": "Lớp đơn vị", "opts": ["Lớp nghìn", "Lớp chục", "Lớp triệu", "Lớp đơn vị"]}, {"level": "VD", "q": "Số chẵn có sáu chữ số, lớp nghìn gồm các chữ số 3, 0, 0 và lớp đơn vị gồm các chữ số 1, 1, 8. Số nào thỏa mãn?", "a": "300 118", "opts": ["30 011", "300 181", "300 811", "300 118"]}, {"level": "NB", "q": "Trong số 514 293, chữ số 9 thuộc hàng nào?", "a": "Hàng chục", "opts": ["Hàng nghìn", "Hàng trăm", "Hàng chục", "Hàng chục nghìn"]}, {"level": "TH", "q": "Số có 4 trăm nghìn, 5 chục nghìn, 4 nghìn, 0 trăm, 0 chục và 4 đơn vị là số nào?", "a": "454 004", "opts": ["450 404", "454 040", "454 004", "405 404"]}, {"level": "NB", "q": "Trong số 514 293, chữ số 4 thuộc hàng nào?", "a": "Hàng nghìn", "opts": ["Hàng trăm nghìn", "Hàng trăm", "Hàng nghìn", "Hàng chục nghìn"]}, {"level": "TH", "q": "Trong số 736 772, chữ số 7 ở hàng trăm nghìn có giá trị là bao nhiêu?", "a": "700 000", "opts": ["700 000", "7 000", "70 000", "7 000 000"]}, {"level": "TH", "q": "Trong số 810 003, chữ số 8 có giá trị là bao nhiêu?", "a": "800 000", "opts": ["8 000", "8 000 000", "80 000", "800 000"]}, {"level": "TH", "q": "Trong số 256 837, chữ số 7 có giá trị là bao nhiêu?", "a": "7", "opts": ["70", "7", "700", "7 000"]}, {"level": "VD", "q": "Một giỏ có 3 bông hoa, 3 lon nước; hoa 1 000 đồng/bông, nước 10 000 đồng/lon. Giỏ giá bao nhiêu?", "a": "33 000 đồng", "opts": ["13 000 đồng", "30 000 đồng", "33 000 đồng", "31 000 đồng"]}, {"level": "VD", "q": "Điền số: 1 000 000; 2 000 000; 3 000 000; 4 000 000; ...", "a": "5 000 000", "opts": ["10 000 000", "5 000 000", "4 100 000", "6 000 000"]}, {"level": "NB", "q": "Hàng triệu, hàng chục triệu, hàng trăm triệu hợp thành lớp nào?", "a": "Lớp triệu", "opts": ["Lớp tỉ", "Lớp triệu", "Lớp nghìn", "Lớp đơn vị"]}, {"level": "VD", "q": "Máy tính giá 6 000 000 đồng, xe máy giá 17 000 000 đồng. Xe máy đắt hơn bao nhiêu?", "a": "11 000 000 đồng", "opts": ["13 000 000 đồng", "9 000 000 đồng", "11 000 000 đồng", "23 000 000 đồng"]}, {"level": "TH", "q": "Số có 9 ở hàng chục nghìn, 2 ở hàng nghìn, 3 ở hàng trăm, 4 ở hàng chục và 0 ở hàng đơn vị là số nào?", "a": "92 340", "opts": ["902 340", "29 340", "92 340", "923 400"]}, {"level": "TH", "q": "Trong số 362 820, chữ số 2 ở hàng nghìn có giá trị là bao nhiêu?", "a": "2 000", "opts": ["2", "20", "2 000", "200"]}];let i=0,s=0,l=false,$=x=>document.getElementById(x),N={NB:"Nhận biết",TH:"Thông hiểu",VD:"Vận dụng"};function r(){l=false;let x=Q[i];$("count").textContent=`Câu ${i+1}/30`;$("tag").textContent=N[x.level];$("question").textContent=x.q;$("bar").style.width=i/30*100+"%";$("feedback").textContent="";$("next").style.display="none";$("answers").innerHTML="";x.opts.forEach((o,j)=>{let b=document.createElement("button");b.className="ans";b.innerHTML=`<b>${String.fromCharCode(65+j)}.</b> ${o}`;b.onclick=()=>c(o,b);$("answers").appendChild(b)})}function c(o,b){if(l)return;l=true;let x=Q[i];[...$("answers").children].forEach((z,j)=>{z.disabled=true;if(x.opts[j]===x.a)z.classList.add("correct")});if(o===x.a){s++;$("feedback").textContent="✅ Chính xác!"}else{b.classList.add("wrong");$("feedback").textContent="❌ Chưa đúng. Đáp án đúng: "+x.a}$("score").textContent="⭐ "+s+" điểm";$("next").style.display="block";sendProgress("Đang làm",`${i+1}/30`)}$("next").onclick=()=>{i++;if(i<30)r();else{const finishedAt=now();sendProgress("Hoàn thành","30/30",finishedAt);$("bar").style.width="100%";$("count").textContent="Hoàn thành";$("card").innerHTML=`<div style="text-align:center"><div style="font-size:64px">🏆</div><h2>Hoàn thành 30 câu!</h2><p style="font-size:22px;font-weight:bold">Kết quả: ${s}/30</p><button id=next style="display:block" onclick="location.reload()">Làm lại ↻</button></div>`}};$("startBtn").onclick=()=>{studentName=$("student").value;if(!studentName){$("nameWarn").textContent="Em cần chọn họ và tên trước khi bắt đầu.";return;}startedAt=now();$("start").style.display="none";$("quiz").style.display="block";sendProgress("Đang làm","0/30");r();};</script></body></html>
